<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="cc-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#cc-accent-grad)" filter="url(#glow)" />
  
  <!-- Inner circuit lines -->
  <path d="M30 100 L70 100 L70 60 L130 60 L130 140 L70 140 L70 190 L170 190" 
        stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" />
  <path d="M130 60 L170 60 L170 30 L30 30 L30 170 L170 170" 
        stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.15" />
  
  <!-- Center node -->
  <circle cx="100" cy="100" r="14" fill="#ffffff" />
  <circle cx="100" cy="100" r="6" fill="#8b5cf6" />
  
  <!-- Outer nodes -->
  <circle cx="40" cy="40" r="6" fill="#ffffff" opacity="0.6" />
  <circle cx="160" cy="40" r="6" fill="#ffffff" opacity="0.6" />
  <circle cx="40" cy="160" r="6" fill="#ffffff" opacity="0.6" />
  <circle cx="160" cy="160" r="6" fill="#ffffff" opacity="0.6" />
  
  <!-- Text -->
  <text x="100" cy="150" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" 
        font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">z/ea</text>
  <text x="100" cy="172" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" 
        font-size="10" fill="#a78bfa" text-anchor="middle" letter-spacing="1">AGENT SKILLS</text>
</svg>
