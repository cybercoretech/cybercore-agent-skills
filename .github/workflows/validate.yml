name: Validate Agent Templates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate manifest, skills, templates, and sync state
        run: python scripts/validate_templates.py

      - name: Check website data is generated from the manifest
        run: python scripts/build_site_data.py --check

      - name: Check for private machine and account references
        run: python scripts/check_public_sanitization.py

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find . -path './.git' -prune -o -name 'setup-*.sh' -type f -print0)
          bash -n tests/smoke_installers.sh
          bash -n scripts/install-skill.sh

      - name: Lint shell scripts
        shell: bash
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -name 'setup-*.sh' -type f -print0 \
            | xargs -0 shellcheck -S warning tests/smoke_installers.sh scripts/install-skill.sh

      - name: Smoke-test all installers in temporary directories
        run: bash tests/smoke_installers.sh
