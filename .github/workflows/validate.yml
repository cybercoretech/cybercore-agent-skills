name: Validate Agent Templates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # update-skills.sh recognises old skill versions from the history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate manifest, skills, templates, and sync state
        run: python scripts/validate_templates.py

      - name: Check skill descriptions route agents to the right skill
        run: |
          python scripts/check_skill_descriptions.py
          python -m unittest discover -s tests -p "test_*.py"

      - name: Check website data is generated from the manifest
        run: python scripts/build_site_data.py --check

      - name: Check for private machine and account references
        run: python scripts/check_public_sanitization.py

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find . -path './.git' -prune -o -name 'setup-*.sh' -type f -print0)
          bash -n tests/smoke_installers.sh
          bash -n scripts/install-skill.sh
          bash -n scripts/update-skills.sh

      - name: Lint shell scripts
        shell: bash
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -name 'setup-*.sh' -type f -print0 \
            | xargs -0 shellcheck -S warning tests/smoke_installers.sh scripts/install-skill.sh scripts/update-skills.sh

      - name: Smoke-test all installers in temporary directories
        run: bash tests/smoke_installers.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Site logic and browser tests
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME_BIN SITE_REQUIRE_BROWSER=1
          node --test tests/site/*.test.mjs
