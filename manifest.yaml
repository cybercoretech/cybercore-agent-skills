# Single source of truth for cybercore-agent-skills.
#
# Canonical content lives in skills/<name>/ and rules/<rule>.md.
# scripts/sync_templates.py copies it into every <agent>/agent-project-setup/
# template and renders each installer from templates/setup.sh.in.
# Run `python3 scripts/sync_templates.py` after editing anything here,
# in skills/, in rules/, or in templates/setup.sh.in.

rules: [safety, workflow, concise-output, rust, gleam]

# Skill groups. Default groups are installed by every skills-capable agent.
# Pack groups ship in <template>/packs/<pack>/ and install only with
# `setup-*.sh --with <pack>`.
groups:
  core:
    title: Default
    description: Installed for every agent. Ways of working, quality, security, git, CI, docs and writing.
    default: true
  ai:
    title: AI pack
    description: LLM features, agent prompts and skills, MCP servers, and agent and skill evaluation.
    default: false
    pack: ai
  backend:
    title: Backend pack
    description: HTTP APIs, databases and SQL.
    default: false
    pack: backend
  languages:
    title: Languages pack
    description: Python, TypeScript and Node.js, Zig, Lua, and Qt with C++.
    default: false
    pack: languages
  mobile:
    title: Mobile pack
    description: Native Android and cross-platform mobile apps.
    default: false
    pack: mobile
  office:
    title: Office pack
    description: Word, Excel, PowerPoint and PDF documents.
    default: false
    pack: office
  omarchy:
    title: Omarchy pack
    description: Omarchy desktop operations, Lua config, plugins and themes, and Rust tooling for Omarchy.
    default: false
    pack: omarchy
  ops:
    title: Ops pack
    description: Containers, Linux administration, observability and incident response.
    default: false
    pack: ops
  rust:
    title: Rust pack
    description: Rust libraries and applications, from architecture and async to testing, UI and releases.
    default: false
    pack: rust
  web:
    title: Web pack
    description: Building and auditing web interfaces, accessibility, browser checks and localization.
    default: false
    pack: web
# category and icon are display metadata for the website and README.
# `group` decides where a skill installs: core (default) or one of the packs above.
